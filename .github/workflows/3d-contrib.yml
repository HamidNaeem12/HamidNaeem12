name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 18 * * *"   # runs daily at 6pm UTC (11pm PKT)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: HamidNaeem12
      - name: Commit & Push
        run: |
          git config user.email "hamidnaeem2223ab@gmail.com"
          git config user.name "HamidNaeem12"
          git add -A .
          git commit -m "chore: regen 3D contribution calendar"
          git push
